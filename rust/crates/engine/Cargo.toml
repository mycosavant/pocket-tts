[package]
name = "pocket-tts-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pocket TTS on ONNX Runtime: text preparation, chunking and synthesis"

[dependencies]
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "ndarray", "preload-dylibs", "tls-rustls"] }
safetensors = "0.8"
sentencepiece-rs = "=0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
